name: Puzzels bijwerken

# Downloadt de Lichess-puzzeldatabase en zet een selectie op beginnersniveau in data/puzzles.json.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build_puzzles.py
      - .github/workflows/puzzles.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download database
        run: curl -sSfL -o puzzles.csv.zst https://database.lichess.org/lichess_db_puzzle.csv.zst
      - name: Selecteer puzzels
        run: |
          zstd -dc puzzles.csv.zst | python3 tools/build_puzzles.py > data/puzzles.json
          python3 tools/build_sw.py
      - name: Commit
        run: |
          rm puzzles.csv.zst
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/puzzles.json sw.js
          if git diff --cached --quiet; then echo "Geen wijzigingen"; exit 0; fi
          git commit -m "Puzzels bijwerken uit Lichess-database"
          git pull --rebase origin main
          git push origin HEAD:main
